name: Telegram News Bot

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths-ignore:
      - "state.json"

  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_EN_URL: ${{ vars.TG_EN_URL }}
          RSS_ZH_URL: ${{ vars.RSS_ZH_URL }}
        run: python bot.py

      - name: Save state
        run: |
          # 检查 state.json 是否有新修改或新创建
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "Update bot state [skip ci]"
          git push

          git add state.json
          git commit -m "Update bot state"
          git push
