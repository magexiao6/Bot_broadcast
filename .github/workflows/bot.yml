name: Telegram News Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state.json"
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_EN_URL: ${{ vars.TG_EN_URL }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          MAX_HISTORY_PAGES: "25"
          MAX_BATCHES_PER_RUN: "12"
          MAX_SEND_PER_RUN: "60"
        run: python bot.py

      - name: Save state, including after a failure
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update bot state [skip ci]"
          git push
